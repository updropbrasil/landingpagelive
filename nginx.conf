server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;

  # config.json: nunca cachear — é o que o painel admin edita
  location = /config.json {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
  }

  # imagens e runtime: cache longo
  location ~* \.(jpg|jpeg|png|webp|svg|mp4|js)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # /tabela -> tabela.html
  location = /tabela { try_files /tabela.html =404; }

  # /v2 -> /v2/index.html (teste A/B)
  location = /v2 { return 301 /v2/; }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ /index.html;
  }
}
