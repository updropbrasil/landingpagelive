# ATENÇÃO (30/10): este arquivo e o Dockerfile NÃO são usados no Coolify.
# O Coolify publica com Nixpacks (provedor staticfile), que gera o próprio nginx.conf
# e só inclui o mime.types da raiz no bloco http. Cache, gzip e absolute_redirect
# ficam no mime.types. Este arquivo só vale se o build pack mudar para Dockerfile.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # atrás do proxy do Coolify: redirecionar sempre com caminho relativo (sem http:// nem porta interna)
  absolute_redirect off;

  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;

  # config.json: nunca cachear — é o que o painel admin edita
  location = /config.json {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
  }

  # imagens e runtime: cache longo
  location ~* \.(jpg|jpeg|png|webp|svg|mp4|js)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # /tabela -> tabela.html
  location = /tabela { try_files /tabela.html =404; }

  # /v2 -> /v2/index.html (teste A/B)
  location = /v2 { return 301 /v2/$is_args$args; }

  # /portugal -> /portugal/ (campanha Live Park Portugal)
  location = /portugal { return 301 /portugal/$is_args$args; }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ /index.html;
  }
}
